name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste real credentials, access tokens or real personal data (identity, tax or social security numbers, SIRET, IBAN...).
        Use fictitious values. Security issues must be reported privately (see the repository SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code or steps, with fictitious data. For an URSSAF response, give the fictitious JSON payload and the error code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: PHP 8.3, Symfony 7.2, standalone or bundle...
